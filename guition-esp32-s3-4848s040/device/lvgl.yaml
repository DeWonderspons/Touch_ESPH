lvgl:
  buffer_size: 100%

  top_layer:
    widgets:
      - label:
          text: "-° / -°"
          id: temperatures
          styles: roboto15_style
          align: top_left
          x: 8
          y: 4
          text_color: 0xFFFFFF

      - label:
          text: "--:--"
          id: display_time
          styles: roboto15_style
          align: top_mid
          y: 4
          text_align: center
          text_color: 0xFFFFFF

  pages:

    # ================= MAIN PAGE =================
    - id: main_page
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1)]
        grid_rows: [fr(1), fr(1), fr(1)]
      pad_top: 34
      pad_all: 5
      bg_color: Black

      widgets:

        - button:
            id: bambu_power_button
            grid_cell_column_pos: 2
            grid_cell_row_pos: 1
            width: $button_width
            height: $button_height_single
            checkable: true
            styles: control
            widgets:
              - label:
                  id: bambu_power_button
                  text: "\U000F042B"
                  text_font: $icon_font
                  align: top_left
              - label:
                  text: "Printer"
                  align: bottom_left
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.bambu_p1s

        - button:
            id: filament_dryer_button
            grid_cell_column_pos: 0
            grid_cell_row_pos: 2
            width: $button_width
            height: $button_height_single
            checkable: true
            styles: control
            widgets:
              - label:
                  id: filament_dryer_icon
                  text: "\U000F07DE"
                  text_font: $icon_font
                  align: top_left
              - label:
                  text: "Dryer"
                  align: bottom_left
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.filament_dryer

        - button:
            id: ceiling_light_button
            grid_cell_column_pos: 2
            grid_cell_row_pos: 2
            width: $button_width
            height: $button_height_single
            checkable: true
            styles: control
            widgets:
              - label:
                  id: ceiling_light_icon
                  text: "\U000F0335"
                  text_font: $icon_font
              - label:
                  text: "Ceiling"
                  align: bottom_left
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.ceiling